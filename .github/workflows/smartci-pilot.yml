name: Textual runtime observation experiment
on:
  pull_request:
    branches: [codex/runtime-base]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: textual-observation-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  benchmark:
    name: ${{ matrix.mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        mode: [native, observe]
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: app
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - name: Install native Poetry toolchain
        run: pipx install poetry==1.7.1
      - name: Install native locked dependencies and syntax extras
        working-directory: app
        run: |
          poetry env use "$pythonLocation/bin/python"
          poetry install --no-interaction --extras syntax
          poetry run python -c 'import sys; assert sys.version_info[:2] == (3, 14); print(sys.version)'
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        if: matrix.mode == 'observe'
        with:
          repository: SharmaKunal14/smart-ci
          ref: e878d8b1d9c3e50a19a51476c6115e6239e91c15
          path: tool
          persist-credentials: false
      - name: Install observer without changing native dependencies
        if: matrix.mode == 'observe'
        working-directory: app
        run: poetry run python -m pip install --disable-pip-version-check --no-deps ../tool
      - name: Run full native or instrumented profile
        working-directory: app
        env:
          BENCHMARK_MODE: ${{ matrix.mode }}
        run: |
          poetry run python .smartci/benchmark.py --mode "$BENCHMARK_MODE" \
            --base "$BASE_SHA" --head "$HEAD_SHA" --output "$RUNNER_TEMP/results"
      - name: Preserve independent test results and audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: textual-${{ matrix.mode }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/results
          retention-days: 7
          if-no-files-found: error
