name: Textual process dependency safety audit
on:
  pull_request:
    branches: [codex/process-gap-base]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: textual-breadth-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: app
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - name: Install native Poetry toolchain
        run: pipx install poetry==1.7.1
      - name: Install native locked dependencies and syntax extras
        working-directory: app
        run: |
          poetry env use "$pythonLocation/bin/python"
          poetry install --no-interaction --extras syntax
          poetry run python -c 'import sys; assert sys.version_info[:2] == (3, 14); print(sys.version)'
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: SharmaKunal14/smart-ci
          ref: 13b04ab3eaff4244413f1e81fa5c3e0e32eefbe7
          path: tool
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.11.6'
          enable-cache: false
      - name: Install collector and observer without changing native dependencies
        run: |
          uv sync --project tool --frozen --no-dev --python "$pythonLocation/bin/python"
          cd app
          poetry run python -m pip install --disable-pip-version-check --no-deps ../tool
      - name: Collect native inventory and inspect recorded graph breadth
        working-directory: app
        run: |
          target_python="$(poetry run python -c 'import sys; print(sys.executable)')"
          "$GITHUB_WORKSPACE/tool/.venv/bin/python" "$GITHUB_WORKSPACE/tool/examples/textual/benchmark.py" \
            --mode plan --base "$BASE_SHA" --head "$HEAD_SHA" --target-python "$target_python" \
            --output "$RUNNER_TEMP/audit" --diagnose-reachability
      - name: Verify source-only comparison and retained full fallback
        working-directory: app
        env:
          AUDIT_ROOT: ${{ runner.temp }}/audit
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          root = Path(os.environ["AUDIT_ROOT"])
          def read(filename):
              return json.loads((root / filename).read_text())

          changed = subprocess.run(["git", "diff", "--name-only", os.environ["BASE_SHA"], os.environ["HEAD_SHA"]], check=True, capture_output=True, text=True, timeout=15).stdout.splitlines()
          if changed != ["src/textual/_xterm_parser.py"]:
              raise ValueError("pilot PR must contain only the parser regression")
          base, head = (read(f"{label}-compatibility.json") for label in ("base", "head"))
          for snapshot in (base, head):
              if not any(g["code"] == "DYNAMIC_PROCESS" and g["path"] == "tests/test_pipe.py" for g in snapshot["gaps"]):
                  raise ValueError("child-process dependency must have an explicit gap")
              if snapshot["complete"]:
                  raise ValueError("unsupported process execution cannot be complete")
          for field in ("native_cases_digest", "files", "cases", "environment_identity", "plugins", "edges_digest", "imports_digest"):
              if base[field] != head[field]:
                  raise ValueError(f"unexpected {field} difference")
          report = read("known-reachability.json")
          if report["comparison"] != {"base": os.environ["BASE_SHA"], "head": os.environ["HEAD_SHA"]}:
              raise ValueError("wrong comparison")
          if report["snapshots"] != {"base": base["snapshot_digest"], "head": head["snapshot_digest"]}:
              raise ValueError("wrong snapshots")
          if report["aggregate"]["changed_paths"] != changed or report["unmapped_changed_paths"]:
              raise ValueError("source change missing from diagnostic")
          if report["omission_authorized"] or report["test_execution_performed"] or report["ci_savings_demonstrated"] or report["execution_required"] != "full":
              raise ValueError("diagnostic must not authorize execution or claim savings")
          if read("selection.json")["execution"] != "full" or read("targets.json") is not None:
              raise ValueError("remaining unknown behavior must retain full fallback")
          summary = {"comparison": report["comparison"], "test_files_reached": report["aggregate"]["test_files_reached"], "test_files_total": report["aggregate"]["test_files_total"], "test_files_not_reached": report["aggregate"]["test_files_not_reached"], "remaining_gaps": len(head["gaps"]), "process_gaps": [g for g in head["gaps"] if g["code"] == "DYNAMIC_PROCESS"], "omission_authorized": False, "test_execution_performed": False, "ci_savings_demonstrated": False, "witnesses": report["aggregate"]["witnesses"][:3]}
          (root / "verification.json").write_text(json.dumps(summary, indent=2, sort_keys=True) + "\n")
          print(json.dumps(summary, indent=2))
          PY
      - name: Preserve dependency evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: textual-graph-breadth-${{ github.run_attempt }}
          path: ${{ runner.temp }}/audit
          retention-days: 7
          if-no-files-found: error
